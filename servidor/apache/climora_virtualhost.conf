<VirtualHost *:443>
    ServerName climora.es
    ServerAlias www.climora.es
    DocumentRoot /var/www/climora.es

    <Directory /var/www/climora.es>
        AllowOverride All
        # Directivas para permitir solo el acceso a través del CDN de Cloudflare y la red local
        <RequireAny>
            Require ip 103.21.244.0/22
            Require ip 103.22.200.0/22
            Require ip 103.31.4.0/22
            Require ip 104.16.0.0/13
            Require ip 108.162.192.0/18
            Require ip 131.0.72.0/22
            Require ip 141.101.64.0/18
            Require ip 162.158.0.0/15
            Require ip 172.64.0.0/13
            Require ip 173.245.48.0/20
            Require ip 188.114.96.0/20
            Require ip 190.93.240.0/20
            Require ip 197.234.240.0/22
            Require ip 198.41.128.0/17
            Require ip 185.47.33.140
        </RequireAny>
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/climora_error.log
    CustomLog ${APACHE_LOG_DIR}/climora_access.log combined

    # Certificado SSL Let's Encrypt
    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile /etc/letsencrypt/live/climora.es/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/climora.es/privkey.pem
</VirtualHost>
