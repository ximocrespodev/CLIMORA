#### 2. Archivo: `proftpd/proftpd.conf` (Fragmento Principal)
*Configuración esencial del servidor FTP para la gestión de respaldos y recursos del proyecto en ProFTPD[cite: 123].*

```text
# Declaramos el nombre del servidor FTP
ServerName "Servidor FTP Climora"
ServerType standalone

# Ruta donde se encontrarán los archivos a servir y almacenar
DefaultRoot /Climora_FTP

# Declaramos que no se necesitará una Shell válida para los usuarios autenticados
RequireValidShell off
Port 21
MaxInstances 30

# Grupo y usuario con los que ProFTPD trabajará
User administrador
Group administrador

Umask 000 000
AllowOverwrite on

# Logs del sistema FTP
TransferLog /var/log/proftpd/xferlog
SystemLog /var/log/proftpd/proftpd.log

# Restricciones de acceso al grupo "conexiones"
<Limit LOGIN>
    AllowGroup conexiones
    DenyAll
</Limit>

<Directory /Climora_FTP>
    <Limit ALL>
        AllowGroup conexiones
        DenyAll
    </Limit>
</Directory>
```[cite: 123, 124]

